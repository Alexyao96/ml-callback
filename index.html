<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>授权回调</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2333; --muted:#5b6478; --ok:#11806a; --warn:#b4531a; --line:#dde1e8; --btn:#16244a; --btntext:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1420; --card:#18202f; --text:#e8ebf2; --muted:#9aa3b5; --ok:#4fd1c5; --warn:#f4a259; --line:#2a3447; --btn:#4fd1c5; --btntext:#0f1420; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:8px 0; color:var(--muted); }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  textarea { width:100%; height:96px; margin:12px 0; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:13px/1.4 ui-monospace, Menlo, monospace; resize:none; }
  button { background:var(--btn); color:var(--btntext); border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  ol { color:var(--muted); padding-left:20px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">授权回调</h1>
    <p id="status"></p>
    <textarea id="url" readonly></textarea>
    <button id="copy" type="button">复制整段地址</button>
    <ol>
      <li>点上面的按钮复制整段地址。</li>
      <li>回到本地店铺软件的「授权」页，粘贴并提交。</li>
      <li>请在 30 分钟内完成；授权码只能用一次。</li>
    </ol>
    <p>本页是静态页面，不加载任何外部资源，也不会把授权码发送到任何地方。</p>
  </div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var st = document.getElementById('status');
  var box = document.getElementById('url');
  box.value = location.href;
  if (q.get('code')) {
    document.getElementById('title').textContent = '授权成功';
    st.className = 'ok';
    st.textContent = '已收到授权码，请复制下面的整段地址。';
  } else if (q.get('error')) {
    document.getElementById('title').textContent = '授权未完成';
    st.className = 'warn';
    st.textContent = '美客多返回：' + q.get('error') + (q.get('error_description') ? '（' + q.get('error_description') + '）' : '') + '。请回软件重新发起授权。';
  } else {
    st.textContent = '这是美客多开发者应用的回调页。从软件发起授权后会自动跳到这里。';
  }
  document.getElementById('copy').onclick = function () {
    var btn = this;
    function done() { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = '复制整段地址'; }, 2000); }
    if (navigator.clipboard) { navigator.clipboard.writeText(location.href).then(done, function () { box.select(); document.execCommand('copy'); done(); }); }
    else { box.select(); document.execCommand('copy'); done(); }
  };
})();
</script>
</body>
</html>
